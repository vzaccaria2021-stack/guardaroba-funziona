<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardaroba - Nuova Prenotazione</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        #booking-form { 
            background: white; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            max-width: 460px; 
            width: 100%; 
        }
        h2 { margin-top: 0; color: #333; text-align: center; }
        label { 
            display: block; 
            margin: 18px 0 6px; 
            font-weight: 600; 
            color: #444; 
        }
        input[type="text"], 
        input[type="number"], 
        select { 
            width: 100%; 
            padding: 13px; 
            border: 1.5px solid #ccc; 
            border-radius: 10px; 
            font-size: 16px; 
            box-sizing: border-box; 
        }
        button { 
            margin-top: 20px; 
            padding: 15px; 
            background: #25D366; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
        }
        button:hover { background: #1da851; }

        .privacy-container {
            background: #f8fff8;
            padding: 16px;
            border-radius: 10px;
            margin: 20px 0 5px 0;
            border: 1px solid #d0ebd0;
            font-size: 14.5px;
            line-height: 1.5;
        }
        .privacy-container label {
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            margin: 0;
        }
        .privacy-container input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.4);
            margin-top: 3px;
            flex-shrink: 0;
        }
        .privacy-link { color: #25D366; font-weight: bold; }

        .info-section { 
            margin-top: 25px; 
            padding: 20px; 
            background: #f9f9f9; 
            border-radius: 12px; 
            text-align: center;
        }
        #currentTicketNum { 
            font-size: 3.2em; 
            font-weight: bold; 
            color: #D32525; 
        }
        #status { margin: 15px 0; font-weight: bold; }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
    <div id="booking-form">
        <h2>Nuova Prenotazione Guardaroba</h2>

        <label for="clientName">Nome Cliente</label>
        <input type="text" id="clientName" placeholder="Mario Rossi">

        <label for="customerPhone">Cellulare</label>
        <input type="number" id="customerPhone" placeholder="393331234567">

        <label for="itemCount">Numero Capi</label>
        <select id="itemCount">
            <option value="1">1 Capo</option>
            <option value="2">2 Capi</option>
            <option value="3">3 Capi</option>
            <option value="4">4 Capi</option>
            <option value="5">5 Capi</option>
        </select>

        <!-- PRIVACY CON LINK CORRETTO AL PIETRE NERE RESORT -->
        <div class="privacy-container">
            <label>
                <input type="checkbox" id="privacyConsent" required>
                <span>
                    <strong>Acconsento</strong> al trattamento di nome e telefono<br>
                    per ricevere il ticket WhatsApp e gestire il deposito.
                    <br><br>
                    <small>Dati conservati solo fino al ritiro e cancellati dopo 30 giorni. 
                    <a href="https://www.pietrenereresort.it/privacy/" target="_blank" class="privacy-link">Informativa completa</a></small>
                </span>
            </label>
        </div>

        <button onclick="createBooking()">Genera Ticket + Invia WhatsApp</button>

        <div id="result-display" style="display:none;" class="info-section">
            <div>Ticket N°</div>
            <div id="currentTicketNum"></div>
            <p id="status"></p>
            <a id="waLink" href="#" target="_blank" style="color:#25D366; font-weight:bold;">
                Apri WhatsApp (fallback manuale)
            </a>
        </div>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCU2P3eOGkNvU1TgMnKK3LuD-BwiFEpUGA",
            authDomain: "guardaroba-funziona-1.firebaseapp.com",
            databaseURL: "https://guardaroba-funziona-1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "guardaroba-funziona-1",
            storageBucket: "guardaroba-funziona-1.appspot.com",
            messagingSenderId: "432865003672",
            appId: "1:432865003672:web:526af8c453ae6be544a8ed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const bookingsRef = db.ref('prenotazioni');
        const visibleRef = db.ref('prenotazioni_visibili');  // Per sincronizzazione admin
        const counterRef = db.ref('counter');

        // WhatsApp Business API - INSERISCI I TUOI
        const WHATSAPP_TOKEN = "IL_TUO_TOKEN_PERMANENTE";
        const PHONE_NUMBER_ID = "IL_TUO_PHONE_NUMBER_ID";
        const TEMPLATE_NAME = "ticket_guardaroba";

        let nextTicketNumber = 1;
        counterRef.once('value', s => nextTicketNumber = (s.val() || 0) + 1);

        async function sendWhatsAppTemplate(to, name, ticket, items, time) {
            const url = `https://graph.facebook.com/v20.0/${PHONE_NUMBER_ID}/messages`;
            const payload = {
                messaging_product: "whatsapp",
                to: to,
                type: "template",
                template: {
                    name: TEMPLATE_NAME,
                    language: { code: "it" },
                    components: [{
                        type: "body",
                        parameters: [
                            { type: "text", text: name },
                            { type: "text", text: ticket.toString() },
                            { type: "text", text: items },
                            { type: "text", time }
                        ]
                    }]
                }
            };

            const res = await fetch(url, {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${WHATSAPP_TOKEN}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify(payload)
            });
            return res.ok ? {success:true} : {success:false, error: (await res.json()).error?.message || "Errore"};
        }

        async function createBooking() {
            const name = document.getElementById("clientName").value.trim();
            const phone = document.getElementById("customerPhone").value.trim();
            const items = document.getElementById("itemCount").value;
            const consent = document.getElementById("privacyConsent").checked;

            if (!name || phone.length < 10 || !consent) {
                alert("Compila tutti i campi e accetta la privacy");
                return;
            }

            const ticket = nextTicketNumber++;
            const timeIn = new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});

            const booking = {
                id: ticket, name, phone, items, timeIn,
                status: "pending",
                privacyConsent: true,
                consentTimestamp: firebase.database.ServerValue.TIMESTAMP
            };

            // Duplicazione per admin (senza telefono)
            const visibile = {
                id: ticket,
                name: name,
                items: items,
                timeIn: timeIn,
                status: "pending"
            };

            try {
                await bookingsRef.child(ticket).set(booking);
                await visibleRef.child(ticket).set(visibile);
                await counterRef.set(ticket);

                document.getElementById("currentTicketNum").innerText = ticket;
                document.getElementById("result-display").style.display = "block";
                document.getElementById("status").innerHTML = "Invio in corso…";

                const wa = await sendWhatsAppTemplate(phone, name, ticket, items, timeIn);

                document.getElementById("status").innerHTML = wa.success 
                    ? "Ticket generato e inviato automaticamente!"
                    : `Errore invio automatico<br><small>Usa il link sotto</small>`;
                document.getElementById("status").style.color = wa.success ? "#25D366" : "#D32525";

                // Fallback wa.me
                const msg = `Ciao ${encodeURIComponent(name)}!%0aTicket n° *${ticket}*%0aCapi: ${items}%0aOra deposito: ${timeIn}%0aGrazie e buona serata!`;
                document.getElementById("waLink").href = `https://wa.me/${phone}?text=${msg}`;

                // Reset form
                document.getElementById("clientName").value = "";
                document.getElementById("customerPhone").value = "";
                document.getElementById("itemCount").value = "1";
                document.getElementById("privacyConsent").checked = false;

            } catch (e) {
                alert("Errore: " + e.message);
            }
        }
    </script>
</body>
</html>
