<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardaroba - Nuova Prenotazione</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        #booking-form { 
            background: white; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            max-width: 460px; 
            width: 100%; 
        }
        h2 { margin-top: 0; color: #333; text-align: center; }
        label { 
            display: block; 
            margin: 18px 0 6px; 
            font-weight: 600; 
            color: #444; 
        }
        input[type="text"],
        input[type="number"],
        input[type="tel"],
        select {
            width: 100%; 
            padding: 13px; 
            border: 1.5px solid #ccc; 
            border-radius: 10px; 
            font-size: 16px; 
            box-sizing: border-box; 
        }
        button { 
            margin-top: 20px; 
            padding: 15px; 
            background: #25D366; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
        }
        button:hover { background: #1da851; }

        .privacy-container {
            background: #f8fff8;
            padding: 16px;
            border-radius: 10px;
            margin: 20px 0 5px 0;
            border: 1px solid #d0ebd0;
            font-size: 14.5px;
            line-height: 1.5;
        }
        .privacy-container label {
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            margin: 0;
        }
        .privacy-container input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.4);
            margin-top: 3px;
            flex-shrink: 0;
        }
        .privacy-link { color: #25D366; font-weight: bold; }

        .info-section { 
            margin-top: 25px; 
            padding: 20px; 
            background: #f9f9f9; 
            border-radius: 12px; 
            text-align: center;
        }
        #currentTicketNum { 
            font-size: 3.2em; 
            font-weight: bold; 
            color: #D32525; 
        }
        #printLabelsBtn { display: none; background: #333; }
        #printLabelsBtn:hover { background: #555; }

        /* Etichette adesive: pensate per stampante termica con rotolo 50x30mm.
           Per un formato diverso di etichetta cambia le dimensioni qui sotto
           (in .label) e nel corrispondente @page. */
        #printArea { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { display: block; position: absolute; top: 0; left: 0; }
        }
        @page { size: 50mm 30mm; margin: 0; }
        .label {
            width: 50mm;
            height: 30mm;
            box-sizing: border-box;
            padding: 2mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            page-break-after: always;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .label:last-child { page-break-after: auto; }
        .label-ticket { font-size: 16pt; font-weight: bold; }
        .label-sub { font-size: 8pt; margin-top: 1mm; }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <!-- Barcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>
    <div id="booking-form">
        <h2>Nuova Prenotazione Guardaroba</h2>

        <label for="clientName">Nome Cliente</label>
        <input type="text" id="clientName" placeholder="Mario Rossi">

        <label for="customerPhone">Cellulare</label>
        <input type="tel" inputmode="numeric" id="customerPhone" placeholder="393331234567">

        <label for="itemCount">Numero Capi</label>
        <select id="itemCount">
            <option value="1">1 Capo</option>
            <option value="2">2 Capi</option>
            <option value="3">3 Capi</option>
            <option value="4">4 Capi</option>
            <option value="5">5 Capi</option>
        </select>

        <div class="privacy-container">
            <label>
                <input type="checkbox" id="privacyConsent" required>
                <span>
                    <strong>Acconsento</strong> al trattamento di nome e telefono<br>
                    per gestire il deposito.
                    <br><br>
                    <small>Dati conservati solo fino al ritiro e cancellati dopo 30 giorni. 
                    <a href="https://www.pietrenereresort.it/privacy/" target="_blank" class="privacy-link">Informativa completa</a></small>
                </span>
            </label>
        </div>

        <button onclick="createBooking()">Genera Ticket</button>

        <div id="result-display" style="display:none;" class="info-section">
            <div>Ticket N°</div>
            <div id="currentTicketNum"></div>
            <button id="printLabelsBtn" onclick="window.print()">Stampa Etichette</button>
        </div>
    </div>

    <div id="printArea">
        <div class="label">
            <div class="label-ticket">#<span class="ticket-num"></span></div>
            <svg class="barcode-garment"></svg>
            <div class="label-sub">Capo depositato</div>
        </div>
        <div class="label">
            <div class="label-ticket">#<span class="ticket-num"></span></div>
            <svg class="barcode-customer"></svg>
            <div class="label-sub" id="customerLabelInfo"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCU2P3eOGkNvU1TgMnKK3LuD-BwiFEpUGA",
            authDomain: "guardaroba-funziona-1.firebaseapp.com",
            databaseURL: "https://guardaroba-funziona-1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "guardaroba-funziona-1",
            storageBucket: "guardaroba-funziona-1.appspot.com",
            messagingSenderId: "432865003672",
            appId: "1:432865003672:web:526af8c453ae6be544a8ed"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const bookingsRef = db.ref('prenotazioni');
        const visibleRef = db.ref('prenotazioni_visibili');  // Nodo per admin
        const counterRef = db.ref('counter');
        const occupiedRef = db.ref('occupiedSlots');
        const configRef = db.ref('config');

        // Assegna atomicamente il primo appendiabiti/gruccia libero (configurabile
        // dalla pagina admin), così il posto non lo sceglie l'operatore.
        async function assignSlot(numRacks, hangersPerRack) {
            let chosenRack = null, chosenHanger = null;
            const result = await occupiedRef.transaction(current => {
                current = current || {};
                chosenRack = null;
                chosenHanger = null;
                slotSearch:
                for (let r = 1; r <= numRacks; r++) {
                    for (let h = 1; h <= hangersPerRack; h++) {
                        const key = `r${r}h${h}`;
                        if (!current[key]) {
                            chosenRack = r;
                            chosenHanger = h;
                            current[key] = true;
                            break slotSearch;
                        }
                    }
                }
                if (chosenRack === null) return; // nessun posto libero: annulla la transazione
                return current;
            });

            if (!result.committed || chosenRack === null) {
                throw new Error("Nessun posto libero nel guardaroba");
            }
            return { rack: chosenRack, hanger: chosenHanger };
        }

        async function createBooking() {
            const name = document.getElementById("clientName").value.trim();
            const phone = document.getElementById("customerPhone").value.trim();
            const items = document.getElementById("itemCount").value;
            const consent = document.getElementById("privacyConsent").checked;

            if (!name || phone.length < 10 || !consent) {
                alert("Compila tutti i campi e accetta la privacy");
                return;
            }

            const timeIn = new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});

            let rack, hanger;
            try {
                const configSnap = await configRef.once('value');
                const config = configSnap.val() || { numRacks: 5, hangersPerRack: 20 };
                const assigned = await assignSlot(config.numRacks, config.hangersPerRack);
                rack = assigned.rack;
                hanger = assigned.hanger;
            } catch (e) {
                alert("Errore: " + e.message);
                return;
            }

            let ticket;
            try {
                const result = await counterRef.transaction(current => (current || 0) + 1);
                ticket = result.snapshot.val();
            } catch (e) {
                alert("Errore: " + e.message);
                return;
            }

            const booking = {
                id: ticket,
                name,
                phone,
                items,
                rack,
                hanger,
                timeIn,
                status: "pending",
                privacyConsent: true,
                consentTimestamp: firebase.database.ServerValue.TIMESTAMP
            };

            // Duplicazione per admin: INCLUDE IL TELEFONO per invio messaggio ritiro
            const visibile = {
                id: ticket,
                name: name,
                items: items,
                rack: rack,
                hanger: hanger,
                timeIn: timeIn,
                phone: phone,  // ← CRUCIALE: serve all'admin per inviare messaggio ritiro
                status: "pending"
            };

            try {
                await bookingsRef.child(ticket).set(booking);
                await visibleRef.child(ticket).set(visibile);

                document.getElementById("currentTicketNum").innerText = ticket;
                document.getElementById("result-display").style.display = "block";

                document.querySelectorAll("#printArea .ticket-num").forEach(el => el.innerText = ticket);
                JsBarcode(".barcode-garment", ticket.toString(), { format: "CODE128", displayValue: false, height: 40 });
                JsBarcode(".barcode-customer", ticket.toString(), { format: "CODE128", displayValue: false, height: 40 });
                document.getElementById("customerLabelInfo").innerText = `${name} - ${items} capi - ${timeIn}`;
                document.getElementById("printLabelsBtn").style.display = "block";

                // Reset form
                document.getElementById("clientName").value = "";
                document.getElementById("customerPhone").value = "";
                document.getElementById("itemCount").value = "1";
                document.getElementById("privacyConsent").checked = false;

            } catch (e) {
                alert("Errore: " + e.message);
            }
        }
    </script>
</body>
</html>
