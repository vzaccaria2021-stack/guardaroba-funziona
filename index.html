<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardaroBa Prenotato</title>
    <style>
        body { background: linear-gradient(135deg, #1a0033, #000); color: #fff; font-family: Arial; text-align: center; padding: 50px; }
        h1 { color: #ff00aa; font-size: 3em; }
        input, button { padding: 15px; margin: 10px; font-size: 1.2em; border: none; border-radius: 25px; }
        input { background: rgba(255,255,255,0.2); color: white; width: 80%; }
        button { background: #ff00aa; color: white; cursor: pointer; }
        .numero { font-size: 5em; color: #ff00aa; margin: 20px; }
    </style>
    <script type="module">
        // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCclXJ4lqgL2dZCZfzD9uVdai0RuFziERQ",
  authDomain: "guardaroba-prenotato.firebaseapp.com",
  projectId: "guardaroba-prenotato",
  storageBucket: "guardaroba-prenotato.firebasestorage.app",
  messagingSenderId: "994569794036",
  appId: "1:994569794036:web:445da2dd598745585a49a1",
  measurementId: "G-P3XK7XW7EL"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    </script>
</head>
<body>
    <h1>Guardaro<span style="color:#ff00aa;">Ba</span> Prenotato</h1>
    <p>Prenota il tuo numero!</p>
    <input type="text" id="nome" placeholder="Il tuo nome/nickname">
    <br>
    <button onclick="prenota()">PRENOTA</button>
    <div id="risultato"></div>
    <div id="numero" class="numero" style="display:none;"></div>

    <script type="module">
        async function prenota() {
            let nome = document.getElementById('nome').value.trim();
            let res = document.getElementById('risultato');
            if (!nome) { res.innerHTML = '<p style="color:red;">Scrivi un nome!</p>'; return; }

            const q = query(collection(db, "prenotazioni"), orderBy("numero", "desc"), limit(1));
            const querySnapshot = await getDocs(q);
            let ultimoNumero = 0;
            if (!querySnapshot.empty) {
                ultimoNumero = querySnapshot.docs[0].data().numero;
            }
            const nuovoNumero = ultimoNumero + 1;
            if (nuovoNumero > 100) { res.innerHTML = '<p style="color:red;">SOLD OUT!</p>'; return; }
            const num = String(nuovoNumero).padStart(3, '0');

            await addDoc(collection(db, "prenotazioni"), { numero: nuovoNumero, nome: nome, timestamp: new Date() });

            res.innerHTML = `<p>Congratulazioni <b>${nome}</b>!</p>`;
            document.getElementById('numero').textContent = num;
            document.getElementById('numero').style.display = 'block';
            document.getElementById('nome').value = '';
        }
    </script>
</body>
</html>
