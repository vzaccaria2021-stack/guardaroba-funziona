<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardaroba - Nuova Prenotazione</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #booking-form { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; }
        input[type="text"], input[type="number"], select { padding: 10px; width: 100%; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { padding: 12px 25px; background-color: #25D366; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 6px; width: 100%; margin-bottom: 15px;}
        .info-section { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc; }
        #currentTicketNum { color: #D32525; font-size: 2.5em; font-weight: bold; display: block; margin: 10px 0; }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
    <div id="booking-form">
        <h2>Nuova Prenotazione</h2>
        <label for="clientName">Nome Cliente:</label>
        <input type="text" id="clientName" placeholder="Mario Rossi" required>
        <label for="customerPhone">Cellulare Cliente (es. 39333...):</label>
        <input type="number" id="customerPhone" placeholder="39xxxxxxxxxx" required>
        <label for="itemCount">Numero Capi:</label>
        <select id="itemCount">
            <option value="1">1 Capo</option>
            <option value="2">2 Capi</option>
            <option value="3">3 Capi</option>
            <option value="4">4 Capi</option>
            <option value="5">5 Capi</option>
        </select>
        <button onclick="createBooking()">Genera Ticket</button>
        <div id="result-display" style="display:none;" class="info-section">
            <h3>Ticket N°: <span id="currentTicketNum"></span></h3>
            <a id="waLink" href="#" target="_blank" style="color: #25D366; text-decoration: none;">Invia Ticket via WhatsApp</a>
        </div>
    </div>

    <!-- SCRIPT MESSO IN FONDO (dopo il pulsante) → così createBooking esiste! -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCU2P3eOGkNvU1TgMnKK3LuD-BwiFEpUGA",
            authDomain: "guardaroba-funziona-1.firebaseapp.com",
            databaseURL: "https://guardaroba-funziona-1-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "guardaroba-funziona-1",
            storageBucket: "guardaroba-funziona-1.appspot.com",
            messagingSenderId: "432865003672",
            appId: "1:432865003672:web:526af8c453ae6be544a8ed",
            measurementId: "G-HV1YPDQ0WY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const bookingsRef = db.ref('prenotazioni');
        const counterRef = db.ref('counter');

        let nextTicketNumber = 1;
        counterRef.once('value', (snapshot) => {
            nextTicketNumber = (snapshot.val() || 0) + 1;
        });

        function createBooking() {
            const name = document.getElementById("clientName").value.trim();
            const phone = document.getElementById("customerPhone").value.trim();
            const itemCount = document.getElementById("itemCount").value;

            if (!name || phone.length < 10) {
                alert("Inserisci nome e numero di telefono validi.");
                return;
            }

            const ticketNumber = nextTicketNumber++;
            const now = new Date();
            const timeIn = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

            const newBooking = {
                id: ticketNumber,
                name: name,
                phone: phone,
                items: itemCount,
                timeIn: timeIn,
                status: "pending",
                timeOut: null
            };

            bookingsRef.child(ticketNumber).set(newBooking).then(() => {
                counterRef.set(ticketNumber);
                document.getElementById("currentTicketNum").innerText = ticketNumber;
                document.getElementById("result-display").style.display = "block";

                const message = `Ciao ${name}!\nIl tuo deposito è confermato.\nTicket n°: *${ticketNumber}*\nCapi: ${itemCount}\nOra deposito: ${timeIn}`;
                document.getElementById("waLink").href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

                document.getElementById("clientName").value = "";
                document.getElementById("customerPhone").value = "";
                document.getElementById("itemCount").value = "1";

                alert("Ticket generato e salvato su tutti i dispositivi!");
            }).catch(err => alert("Errore: " + err.message));
        }
    </script>
</body>
</html>
