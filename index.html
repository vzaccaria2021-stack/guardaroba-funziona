<h1>GuardaroBa Prenotato</h1>
<p>Prenota il tuo numero per depositare il capo. Inserisci nome e telefono per ricevere il biglietto via messaggio.</p>

<form id="prenotazioneForm">
  <label for="nome">Nome:</label>
  <input type="text" id="nome" required>
  <label for="telefono">Numero di Telefono (es. +393xxxxxxxxx):</label>
  <input type="tel" id="telefono" required>
  <button type="submit">PRENOTA</button>
</form>

<div id="qrcode" style="display:none;"></div> <!-- QR temporaneo per generazione -->
<p id="messaggio"></p>

<script>
  // Assumi Firebase inizializzato come prima
  const form = document.getElementById('prenotazioneForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = document.getElementById('nome').value;
    const telefono = document.getElementById('telefono').value;

    // Genera numero unico incrementale
    const counterRef = db.collection('contatori').doc('prenotazioni');
    let numero = 1;
    await db.runTransaction(async (transaction) => {
      const counter = await transaction.get(counterRef);
      numero = (counter.exists ? counter.data().count + 1 : 1);
      transaction.set(counterRef, { count: numero });
    });

    // Salva prenotazione
    const prenotazioneId = numero.toString();
    await db.collection('prenotazioni').doc(prenotazioneId).set({
      nome: nome,
      telefono: telefono,
      status: 'depositato',
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Genera QR con dati (numero e nome)
    const qrData = `Prenotazione:${numero}|Nome:${nome}`; // Formato semplice per parsing
    const qrElement = document.getElementById('qrcode');
    new QRCode(qrElement, qrData);

    // Converti QR in immagine base64 per invio (o carica su Storage)
    const qrCanvas = qrElement.querySelector('canvas');
    const qrImageBase64 = qrCanvas.toDataURL('image/png');

    // Invia SMS con numero e QR (o link a QR)
    const sendSMS = firebase.functions().httpsCallable('inviaSMS');
    const messaggio = `La tua prenotazione n. ${numero}. Mostra questo QR per ritirare: [QR allegato o link]`;
    await sendSMS({ telefono: telefono, messaggio: messaggio, qrBase64: qrImageBase64 }); // Modifica la function per gestire base64 se necessario

    document.getElementById('messaggio').textContent = 'Prenotazione effettuata! Riceverai un messaggio con il biglietto.';
    qrElement.style.display = 'none'; // Nascondi QR dopo
  });
</script>
