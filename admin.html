<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Amministrativa Guardaroba</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script> <!-- Minimale: Per scanning QR -->

    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .dashboard { background-color: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; color: #333; }
        
        .header-stats { display: flex; justify-content: space-around; margin-bottom: 20px; padding: 15px; background-color: #e8f5e9; border-radius: 6px; border: 1px solid #c8e6c9; }
        .stat { text-align: center; }
        .stat span { font-size: 1.8em; font-weight: bold; color: #388e3c; display: block; }
        
        .booking-item { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; background-color: #fff; }
        .booking-item.retrieved { background-color: #f1f8e9; opacity: 0.7; }
        .booking-item.retrieved .item-details { text-decoration: line-through; color: #666; }
        .item-details strong { color: #00796b; }
        .item-details small { display: block; color: #999; margin-top: 5px; }

        .action-button { 
            padding: 8px 15px; 
            background-color: #ff9800; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background-color 0.3s;
        }
        .action-button:hover:not(:disabled) { background-color: #fb8c00; }
        .retrieved-info { font-size: 0.9em; color: #388e3c; font-weight: bold; }
        /* Aggiunto minimale: Stili per scanner, integrati con esistenti */
        #scanBtn { background-color: #25D366; margin-top: 10px; }
        #videoContainer { display: none; margin: 20px 0; text-align: center; }
        #video { width: 100%; max-width: 300px; border: 1px solid #ddd; border-radius: 4px; }
        #closeScanBtn { background-color: #d32f2f; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="dashboard">
            <h1>Dashboard Guardaroba 📊</h1>
            <p>Dati visibili solo su questo browser.</p>

            <div class="header-stats">
                <div class="stat">Totali: <span id="totalBookings">0</span></div>
                <div class="stat">Da Ritirare: <span id="pendingBookings">0</span></div>
                <div class="stat">Ritirati: <span id="retrievedBookings">0</span></div>
            </div>

            <h2>Lista Prenotazioni</h2>
            <div id="activeBookingsList"></div>
            
            <!-- Aggiunto: Bottone per scanner -->
            <button id="scanBtn" onclick="startScanner()">Scansiona QR dal Cliente</button>
            <div id="videoContainer">
                <video id="video" autoplay></video>
                <canvas id="canvas" style="display:none;"></canvas>
                <button id="closeScanBtn" onclick="stopScanner()">Chiudi Scanner</button>
            </div>
            
            <button onclick="resetDayCounter()" style="background-color: #d32f2f; margin-top: 20px; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">Resetta Tutto</button>
        </div>
    </div>

    <script>
        const BOOKINGS_KEY = 'guardaroba_prenotazioni'; 
        
        function loadBookings() {
            try {
                const data = localStorage.getItem(BOOKINGS_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }
        
        function saveBookings(bookings) {
            localStorage.setItem(BOOKINGS_KEY, JSON.stringify(bookings));
        }

        function markRetrieved(ticketId) {
            let bookings = loadBookings();
            const booking = bookings.find(b => b.id === ticketId);

            if (booking && booking.status === 'pending') {
                const now = new Date();
                booking.timeOut = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                booking.status = 'retrieved';
                
                saveBookings(bookings);
                renderBookingList();
            }
        }

        function renderBookingList() {
            const bookings = loadBookings();
            const listContainer = document.getElementById('activeBookingsList');
            listContainer.innerHTML = '';
            
            let total = bookings.length;
            let pending = bookings.filter(b => b.status === 'pending').length;
            let retrieved = total - pending;

            document.getElementById('totalBookings').innerText = total;
            document.getElementById('pendingBookings').innerText = pending;
            document.getElementById('retrievedBookings').innerText = retrieved;

            if (total === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: #666;">Nessuna prenotazione attiva.</p>';
                return;
            }

            const sortedBookings = bookings.sort((a, b) => {
                if (a.status === 'pending' && b.status !== 'pending') return -1;
                if (a.status !== 'pending' && b.status === 'pending') return 1;
                return 0;
            });

            sortedBookings.forEach(booking => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `booking-item ${booking.status}`;
                
                let buttonHTML;
                let infoText = `Ingresso: ${booking.timeIn}`;

                if (booking.status === 'pending') {
                    buttonHTML = `<button class="action-button" onclick="markRetrieved(${booking.id})">Ritirato</button>`;
                } else {
                    buttonHTML = `<span class="retrieved-info">Ritirato alle ${booking.timeOut}</span>`;
                }

                itemDiv.innerHTML = `
                    <div class="item-details">
                        <strong>Ticket #${booking.id} (${booking.items} capo/i)</strong><br>
                        ${booking.name} - Cell: ${booking.phone}<br>
                        <small>Ora di deposito: ${infoText}</small>
                    </div>
                    <div>
                        ${buttonHTML}
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });
        }
        
        function resetDayCounter() {
            if (confirm("Sei sicuro di voler resettare? Questo cancellerà TUTTE le prenotazioni.")) {
                localStorage.removeItem(BOOKINGS_KEY);
                localStorage.setItem('guardaroba_counter', 1);
                renderBookingList();
            }
        }

        // Aggiunto: Funzioni per scanning QR (minimale, senza alterare layout)
        let videoStream;
        
        function startScanner() {
            document.getElementById('videoContainer').style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    videoStream = stream;
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    video.play();
                    requestAnimationFrame(scanQR);
                })
                .catch(err => alert('Errore accesso camera: ' + err));
        }
        
        function stopScanner() {
            if (videoStream) videoStream.getTracks().forEach(track => track.stop());
            document.getElementById('videoContainer').style.display = 'none';
        }
        
        function scanQR() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            if (video.videoWidth > 0 && video.videoHeight > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                
                if (code) {
                    try {
                        const bookingData = JSON.parse(code.data);
                        if (bookingData.id && bookingData.status === 'pending') {
                            markRetrieved(bookingData.id);
                            alert(`QR scansionato! Ticket #${bookingData.id} ritirato.`);
                            stopScanner();
                            return;
                        } else {
                            alert('QR non valido o già ritirato.');
                        }
                    } catch {
                        alert('Dati QR non validi.');
                    }
                }
            }
            requestAnimationFrame(scanQR);
        }

        document.addEventListener('DOMContentLoaded', renderBookingList);
    </script>
</body>
</html>
