<video id="video" width="300" height="200" autoplay style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>
<button onclick="avviaScanner()">Scansiona QR per Ritirare</button>

<script>
  // Assumi db (Firestore) inizializzato

  // Modifica il listener della lista per mostrare status e messaggio
  db.collection('prenotazioni').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
    const lista = document.getElementById('listaPrenotazioni'); // Assumi ID esistente per la lista
    lista.innerHTML = '';
    let postiOccupati = 0;
    snapshot.forEach(doc => {
      const data = doc.data();
      const li = document.createElement('li');
      li.textContent = `${doc.id} - ${data.nome} - Status: ${data.status}`;
      if (data.status === 'ritirato') {
        li.textContent += ' - Il capo è stato ritirato!';
        li.style.color = 'green'; // Opzionale: stile per evidenziare
      } else {
        postiOccupati++;
      }
      lista.appendChild(li);
    });
    // Aggiorna posti liberi (assumi max 100)
    document.getElementById('postiLiberi').textContent = `Posti liberi: ${100 - postiOccupati}`; // Assumi ID esistente
  });

  // Funzione per avviare scanner
  async function avviaScanner() {
    const video = document.getElementById('video');
    video.style.display = 'block';
    const canvas = document.getElementById('canvas');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;

    const interval = setInterval(() => {
      if (video.videoWidth > 0 && video.videoHeight > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const imageData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code) {
          clearInterval(interval);
          stream.getTracks().forEach(track => track.stop());
          video.style.display = 'none';
          // Parsa dati da QR (es. Prenotazione:123|Nome:Nome)
          const parts = code.data.split('|');
          const numero = parts[0].split(':')[1];
          db.collection('prenotazioni').doc(numero).update({ status: 'ritirato' });
          alert('QR scansionato! Capo ritirato.');
        }
      }
    }, 300); // Check ogni 300ms
  }

  // Per il RESET TOTALE (se non c'è già)
  document.getElementById('resetButton').addEventListener('click', async () => { // Assumi ID
    if (confirm('Sicuro di resettare tutto?')) {
      const batch = db.batch();
      const prenotazioni = await db.collection('prenotazioni').get();
      prenotazioni.forEach(doc => batch.delete(doc.ref));
      batch.update(db.collection('contatori').doc('prenotazioni'), { count: 0 });
      await batch.commit();
    }
  });
</script>
